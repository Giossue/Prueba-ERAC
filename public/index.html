<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="encabezado">
        <h1>Productos</h1>
    </header>

    <main class="contenedor">
        <section class="tarjeta">
            <h2 id="titulo-formulario">Nuevo producto</h2>

            <form id="formulario-producto" novalidate>
                <input type="hidden" id="producto-id">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" maxlength="100" required>
                    <small class="error" data-error-para="nombre"></small>
                </div>

                <div class="campo">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" maxlength="500" rows="3"></textarea>
                    <small class="error" data-error-para="descripcion"></small>
                </div>

                <div class="fila">
                    <div class="campo">
                        <label for="precio">Precio</label>
                        <input type="number" id="precio" name="precio" min="0" step="0.01" required>
                        <small class="error" data-error-para="precio"></small>
                    </div>

                    <div class="campo">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" name="stock" min="0" step="1" required>
                        <small class="error" data-error-para="stock"></small>
                    </div>
                </div>

                <div class="acciones">
                    <button type="submit" class="boton boton-primario" id="boton-guardar">Guardar</button>
                    <button type="button" class="boton" id="boton-cancelar" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <section class="tarjeta">
            <h2>Listado</h2>
            <p id="mensaje" class="mensaje" role="status" hidden></p>

            <div class="contenedor-tabla">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th class="numero">Precio</th>
                            <th class="numero">Stock</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="lista-productos">
                        <tr><td colspan="6" class="vacio">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
